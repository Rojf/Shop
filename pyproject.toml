[tool.poetry]
name = "shop"
version = "0.1.0"
description = "Shop APIs"
authors = ["Blank <rojermen96@gmail.com>"]
license = "BSD-2-Clause license"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.4"
django-ninja = "^1.3.0"
python-dotenv = "^1.0.1"
pillow = "^11.0.0"
celery = "^5.4.0"
django-types = "^0.20.0"
weasyprint = "^64.0"
stripe = "^11.5.0"
django-redis = "^5.4.0"


[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "^4.4.6"
requests = "^2.32.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12.6"
