[tool.poetry]
name = "shop"
version = "0.1.0"
description = "Shop APIs"
authors = ["Blank <rojermen96@gmail.com>"]
license = "BSD-2-Clause license"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.4"
django-ninja = "^1.3.0"
python-dotenv = "^1.0.1"
pillow = "^11.0.0"
celery = "^5.4.0"
django-types = "^0.20.0"
weasyprint = "^64.0"
stripe = "^11.5.0"
django-redis = "^5.4.0"
pre-commit = "^4.1.0"
pylint-django = "^2.6.1"
bandit = "^1.8.2"


[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "^4.4.6"
requests = "^2.32.3"
pylint = "^3.3.4"
flake8 = "^7.1.1"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["migrations", "node_modules", "__pycache__", "tests"]
pythonVersion = "3.12.8"

[tool.black]
line-length = 90
skip-string-normalization = true
skip-magic-trailing-comma = false
exclude = '''
/(
  migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 90
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["*/migrations/*"]

[tool.pylint]
disable = ["C0114", "R0901", "C0115", "C0116", "R0903", "R0801"]
max-line-length = 90

[tool.pylint.MASTER]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"
init-hook = """
import sys, os
sys.path.append('.venv/lib/python3.12/site-packages')
#sys.path.append(os.path.abspath("src"))
sys.path.append(os.path.abspath("src/cart"))
sys.path.append(os.path.abspath("src/catalog"))
sys.path.append(os.path.abspath("src/notification"))
sys.path.append(os.path.abspath("src/orders"))
sys.path.append(os.path.abspath("src/payment"))
sys.path.append(os.path.abspath("src/users"))
"""
ignore-paths = [
  ".*/manage.py",
  ".*/migrations/.*.py$",
  ".venv",
  "^.*.pyi$",
  "^.*_prv_.*$",
  "lib",
  ".*tests/.*",
]

[tool.pylint.REPORTING]
output-format = "colorized"

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
tests = ["B101", "B102", "B110", "B404", "B509"]
