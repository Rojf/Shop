name: shop-microservice

networks:
  shop_net:
    name: shop_net

volumes:
  redis_data:
    name: shop_redis_data
  shop_db:
    name: shop_db_data
  rabbitmq_data:
  rabbitmq_logs:

services:
  db:
    image: postgres:${POSTGRES_TAG:-17.2}
    container_name: postgres
    volumes:
      - shop_db:/var/lib/postgresql/data/
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ../../.env
    labels:
      - "traefik.enable=false"
    restart: unless-stopped
    healthcheck:
      test: psql -h 0.0.0.0 -U ${POSTGRES_USER:-user-shop} -d ${POSTGRES_DB:-shop} -c 'SELECT 1;'
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shop_net

  redis:
    image: redis/redis-stack:${REDIS_TAG:-7.4.0-v3}
    container_name: redis
    volumes:
      - redis_data:/data
    env_file:
      - ../../.env
    labels:
      - "traefik.enable=false"
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - shop_net

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./definitions.json:/etc/rabbitmq/definitions.json
    labels:
      - "traefik.enable=False"
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shop_net

  cart-service:
    container_name: cart_service
    build:
      context: ../../
      dockerfile: src/cart/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../src/cart/.env
      - ../../.env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cart.rule=Host(`api.mysite.com`) && PathPrefix(`/v1/cart`)"
      - "traefik.http.services.cart-service.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/cart"]
      interval: 10s
      retries: 5
      timeout: 3s
    networks:
      - shop_net

  catalog-service:
    container_name: catalog_service
    build:
      context: ../../
      dockerfile: src/catalog/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../src/catalog/.env
      - ../../.env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=Host(`api.mysite.com`) && PathPrefix(`/v1/catalog`)"
      - "traefik.http.services.catalog-service.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/catalog"]
      interval: 10s
      retries: 5
      timeout: 3s
    networks:
      - shop_net

