name: shop-microservice

networks:
  shop_net:
    name: shop_net

volumes:
  shop_db:
    name: shop_db_data

services:
  db:
    image: postgres:${POSTGRES_TAG:-17.2}
    container_name: postgres_db
    volumes:
      - shop_db:/var/lib/postgresql/data/
    env_file:
      - ../../example.env
    restart: unless-stopped
    healthcheck:
      test: psql -h 0.0.0.0 -U ${POSTGRES_USER:-user-shop} -d ${POSTGRES_DB:-shop} -c 'SELECT 1;'
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shop_net

  cart-service:
    container_name: cart_service
    build:
      context: ../../
      dockerfile: src/cart/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../src/cart/example.env
      - ../../example.env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cart.rule=PathPrefix(`/api/v1/cart`)"
      - "traefik.http.services.cart-service.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/cart"]
      interval: 10s
      retries: 5
      timeout: 3s
    networks:
      - shop_net

  catalog-service:
    container_name: catalog_service
    build:
      context: ../../
      dockerfile: src/catalog/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../src/catalog/example.env
      - ../../example.env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=PathPrefix(`/api/v1/catalog`)"
      - "traefik.http.services.catalog-service.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/catalog/health"]
      interval: 10s
      retries: 5
      timeout: 3s
    networks:
      - shop_net

